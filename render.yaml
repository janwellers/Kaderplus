services:
  - type: web
    name: kaderplus
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: NODE_ENV
        value: production
      # Datenbank für Stellen & Eingänge (Neon/Supabase). Im Render-Dashboard eintragen.
      - key: DATABASE_URL
        sync: false
      # Passwort für den Admin-Bereich (/admin). Im Render-Dashboard eintragen.
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
      - key: NOTIFY_EMAIL
        value: jan@kaderplus.de
      - key: MAIL_FROM
        value: Kaderplus <no-reply@kaderplus.de>
      # Mailversand über HTTPS – funktioniert auch im Free-Tier, in dem ausgehende
      # SMTP-Ports gesperrt sind. Im Render-Dashboard eintragen (Brevo hat Vorrang).
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Alternative: SMTP-Zugangsdaten (nur genutzt, wenn kein API-Key gesetzt ist)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
